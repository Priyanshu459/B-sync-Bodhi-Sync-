<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>B-sync</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      if (window.api && window.api.logError) {
        window.api.logError(message + ' at ' + source + ':' + lineno);
      }
    };
  </script>
</head>
<body>
  <!-- Titlebar (Top) -->
  <div class="titlebar">
    <div class="nav-controls">
      <button id="btn-back" class="nav-btn" title="Go back"><i class="ph ph-caret-left"></i></button>
      <button id="btn-forward" class="nav-btn" title="Go forward"><i class="ph ph-caret-right"></i></button>
      <button id="btn-reload" class="nav-btn" title="Reload"><i class="ph ph-arrow-clockwise"></i></button>
      <button id="btn-split" class="nav-btn" title="Split View"><i class="ph ph-columns"></i></button>
    </div>
    
    <div class="address-bar-container">
      <input type="text" id="address-bar" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
      <button id="btn-bookmark" class="icon-btn inside-input" title="Bookmark"><i class="ph ph-star"></i></button>
      <button id="btn-downloads" class="icon-btn inside-input" style="right: 35px;" title="Downloads"><i class="ph ph-download-simple"></i></button>
    </div>

    <div id="downloads-panel" class="hidden">
      <div class="downloads-header">Downloads</div>
      <div id="downloads-list"></div>
    </div>

    <div class="window-controls">
      <button id="btn-minimize" class="win-btn" title="Minimize"><i class="ph ph-minus"></i></button>
      <button id="btn-maximize" class="win-btn" title="Maximize"><i class="ph ph-square"></i></button>
      <button id="btn-close" class="win-btn close" title="Close"><i class="ph ph-x"></i></button>
    </div>
  </div>

  <!-- Sidebar (Left) -->
  <div class="sidebar">
    <button id="btn-new-tab" class="new-tab-btn"><i class="ph ph-plus"></i> New Tab</button>
    <button id="btn-incognito" class="new-tab-btn" style="margin-top: -10px; background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);"><i class="ph ph-mask-happy"></i> Incognito</button>
    <button id="btn-sync" class="new-tab-btn" style="margin-top: -10px; background: rgba(0,255,100,0.1); border-color: rgba(0,255,100,0.2);"><i class="ph ph-cloud"></i> Bodhi Sync</button>
    <div class="tabs-header" style="font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; margin-left: 5px;">Open Tabs</div>
    <div id="tabs-container"></div>
    
    <div class="sidebar-library">
      <div class="sidebar-lib-tabs">
        <button id="tab-bookmarks" class="lib-tab active">Bookmarks</button>
        <button id="tab-history" class="lib-tab">History</button>
      </div>
      <div id="library-list" class="sidebar-lib-list"></div>
    </div>
  </div>

  <!-- Command Palette Overlay -->
  <div id="command-palette-overlay" class="hidden">
    <div id="command-palette">
      <input type="text" id="palette-input" placeholder="Search tabs, bookmarks, history, or type /vault..." autocomplete="off" spellcheck="false">
      <div id="palette-results"></div>
    </div>
  </div>

  <!-- Vault Overlay -->
  <div id="vault-overlay" class="hidden">
    <div id="vault-modal">
      <div class="vault-header">
        <h2><i class="ph ph-lock-key"></i> Secure Password Vault</h2>
        <button id="btn-close-vault" class="icon-btn"><i class="ph ph-x"></i></button>
      </div>
      
      <div id="vault-login">
        <p>Enter your Master Password to decrypt your vault. It never leaves your device unencrypted.</p>
        <input type="password" id="vault-master-pwd" placeholder="Master Password">
        <button id="btn-unlock-vault" class="btn-primary">Unlock Vault</button>
        <p id="vault-error" style="color: #ff4d4d; margin-top: 10px; display: none;">Incorrect Master Password</p>
      </div>

      <div id="vault-content" class="hidden">
        <div class="vault-toolbar">
          <input type="text" id="vault-site-input" placeholder="Website (e.g. google.com)">
          <input type="text" id="vault-user-input" placeholder="Username">
          <input type="password" id="vault-pwd-input" placeholder="Password">
          <button id="btn-add-pwd" class="btn-primary">Add</button>
        </div>
        <div id="vault-list"></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
