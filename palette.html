<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: rgba(30, 30, 30, 0.85);
      --text-color: rgba(255, 255, 255, 0.9);
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 15vh;
    }
    #command-palette {
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }
    #palette-input {
      width: 100%;
      padding: 15px 20px;
      font-size: 18px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    #palette-results {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .palette-item {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    .palette-item.selected {
      background: rgba(255, 255, 255, 0.1);
      border-left-color: #ffb703;
    }
    .palette-item-title {
      font-size: 14px;
      font-weight: 500;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .palette-item-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .palette-item-type {
      font-size: 10px;
      text-transform: uppercase;
      color: #ffb703;
      margin-top: 4px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="command-palette">
    <input type="text" id="palette-input" placeholder="Search tabs, bookmarks, history, or web..." autocomplete="off" spellcheck="false">
    <div id="palette-results"></div>
  </div>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: data:;">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="palette.js"></script>
</body>
</html>
