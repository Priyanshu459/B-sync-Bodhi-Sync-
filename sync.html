<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: rgba(30,30,30,0.85);
      color: white;
      backdrop-filter: blur(20px);
      -webkit-app-region: drag;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
    }
    .container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      -webkit-app-region: no-drag;
    }
    input {
      padding: 10px;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      border-color: rgba(0,255,100,0.5);
    }
    button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    button:hover {
      filter: brightness(1.1);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:18px; margin:0;"><i class="ph ph-cloud"></i> Bodhi Sync</h2>
      <button id="btn-close" style="background:transparent; color:white; padding:5px; margin-top:-5px;"><i class="ph ph-x"></i></button>
    </div>
    
    <div id="sync-auth-view" style="display:flex; flex-direction:column; gap:10px;">
      <input type="text" id="sync-username" placeholder="Username" autocomplete="off" spellcheck="false">
      <input type="password" id="sync-password" placeholder="Password">
      <div style="display:flex; gap:10px;">
        <button id="btn-sync-login" style="flex:1; background:#ffb703; color:black;">Login</button>
        <button id="btn-sync-register" style="flex:1; background:rgba(255,255,255,0.1); color:white;">Register</button>
      </div>
      <div id="sync-auth-error" style="color:#ff4444; font-size:12px; text-align:center; min-height:15px;"></div>
    </div>

    <div id="sync-dashboard-view" class="hidden" style="display:flex; flex-direction:column; gap:10px;">
      <p style="text-align:center; font-size:14px; margin:0; margin-bottom:5px;">User: <span id="sync-user-display" style="font-weight:bold; color:#ffb703;"></span></p>
      <button id="btn-sync-push" style="background:rgba(0,255,100,0.2); color:white; border:1px solid rgba(0,255,100,0.3);"><i class="ph ph-upload-simple"></i> Push to Cloud</button>
      <button id="btn-sync-pull" style="background:rgba(0,150,255,0.2); color:white; border:1px solid rgba(0,150,255,0.3);"><i class="ph ph-download-simple"></i> Pull from Cloud</button>
      <button id="btn-sync-logout" style="background:transparent; color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.1); margin-top:5px;">Logout</button>
      <div id="sync-status" style="color:#00ff66; font-size:12px; text-align:center; min-height:15px;"></div>
    </div>
  </div>
  <script src="sync.js"></script>
</body>
</html>
